<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Gestion Pro — Admin Abonnements</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{--bg:#050a14;--panel:#0a1220;--text:#f5f8ff;--muted:#91a0b8;--blue:#22a9ff;--ok:#2ecc71;--warn:#ffc107;--danger:#ff4d4d;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:20px}
    .container{max-width:1000px;margin:auto}

    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line)}
    h1{font-size:22px}
    h1 span{color:var(--blue)}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:24px}
    .card h2{font-size:17px;color:var(--blue);margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}

    .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .form-row label{font-size:12px;color:var(--muted);font-weight:600}
    .form-row input, .form-row select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:white;font-size:14px;outline:none}

    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;background:var(--blue);color:#000}
    .btn:hover{opacity:.9}
    .btn-small{padding:6px 12px;font-size:12px}

    table{width:100%;border-collapse:collapse;margin-top:10px}
    th, td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
    th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}

    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .badge-ok{background:rgba(46,204,113,.15);color:var(--ok)}
    .badge-warn{background:rgba(255,193,7,.15);color:var(--warn)}
    .badge-danger{background:rgba(255,77,77,.15);color:var(--danger)}

    #refuse{display:none;min-height:70vh;align-items:center;justify-content:center;flex-direction:column;text-align:center}
    #refuse.active{display:flex}
    #admin-content{display:none}
    #admin-content.active{display:block}
  </style>

  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_YnJpZ2h0LWVsZXBoYW50LTMwMzUuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>E<span>-Gestion</span> Pro — Admin</h1>
      <div id="auth-btn"></div>
    </header>

    <!-- Accès refusé si l'utilisateur connecté n'est pas admin -->
    <div id="refuse">
      <h1>⛔ Accès refusé</h1>
      <p style="color:var(--muted);margin-top:10px">Cette page est réservée à l'administrateur d'E-Gestion Pro.</p>
    </div>

    <div id="admin-content">
      <div class="card">
        <h2>Souscrire un client</h2>
        <form id="form-abonnement" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-row" style="grid-column:1/-1">
            <label>User ID Clerk du client (copié depuis le dashboard Clerk)</label>
            <input type="text" id="ab-user-id" placeholder="user_xxxxxxxxxxxx" required>
          </div>
          <div class="form-row"><label>Email du client (repère)</label><input type="email" id="ab-email"></div>
          <div class="form-row">
            <label>Formule</label>
            <select id="ab-plan">
              <option value="mensuel">Mensuel — 10 000 FCFA (30 jours)</option>
              <option value="annuel">Annuel — 100 000 FCFA (365 jours)</option>
              <option value="personnalise">Personnalisé (choisir la date)</option>
            </select>
          </div>
          <div class="form-row"><label>Date d'expiration</label><input type="date" id="ab-expiration" disabled></div>
          <div class="form-row">
            <label>Statut</label>
            <select id="ab-statut">
              <option value="actif">Actif</option>
              <option value="inactif">Inactif</option>
            </select>
          </div>
          <button type="submit" class="btn" style="grid-column:1/-1">Enregistrer l'abonnement</button>
        </form>
      </div>

      <div class="card">
        <h2>Clients abonnés</h2>
        <table><thead><tr><th>Email</th><th>User ID</th><th>Formule</th><th>Expiration</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tbl-abonnements"><tr><td colspan="6">Chargement...</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pmxtqebppwpbgznmtiai.supabase.co";
    const SUPABASE_KEY = "sb_publishable__3zR170TFSBvLJTDlZ_UWQ_wtML7Sv3";
    const ADMIN_EMAILS = ["kenizaraki4@gmail.com"];
    let db = null;

    function handleDbError(context, error) {
      if (!error) return false;
      console.error(`Erreur ${context}:`, error);
      alert(`Erreur lors de ${context} : ${error.message}`);
      return true;
    }

    function estAdmin(user) {
      const email = user?.primaryEmailAddress?.emailAddress || user?.emailAddresses?.[0]?.emailAddress || '';
      return ADMIN_EMAILS.includes(email.toLowerCase());
    }

    function calculerExpiration(plan) {
      const d = new Date();
      if (plan === 'mensuel') d.setDate(d.getDate() + 30);
      else if (plan === 'annuel') d.setDate(d.getDate() + 365);
      else return document.getElementById('ab-expiration').value; // personnalisé : garde la valeur saisie
      return d.toISOString().slice(0, 10);
    }

    document.getElementById('ab-plan').addEventListener('change', (e) => {
      const expInput = document.getElementById('ab-expiration');
      if (e.target.value !== 'personnalise') {
        expInput.value = calculerExpiration(e.target.value);
        expInput.disabled = true;
      } else {
        expInput.disabled = false;
      }
    });

    document.getElementById('form-abonnement').addEventListener('submit', async (e) => {
      e.preventDefault();
      const plan = document.getElementById('ab-plan').value;
      const { error } = await db.from('abonnements').upsert([{
        user_id: document.getElementById('ab-user-id').value.trim(),
        email: document.getElementById('ab-email').value.trim(),
        plan: plan,
        date_expiration: document.getElementById('ab-expiration').value,
        statut: document.getElementById('ab-statut').value
      }], { onConflict: 'user_id' });
      if (handleDbError("l'enregistrement de l'abonnement", error)) return;
      document.getElementById('form-abonnement').reset();
      document.getElementById('ab-expiration').value = calculerExpiration('mensuel');
      document.getElementById('ab-expiration').disabled = true;
      loadAbonnements();
    });

    async function loadAbonnements() {
      const { data, error } = await db.from('abonnements').select('*').order('date_expiration', { ascending: true });
      if (error) { console.error('Erreur chargement abonnements:', error); return; }
      if (!data) return;
      document.getElementById('tbl-abonnements').innerHTML = data.map(a => {
        const aujourdHui = new Date().toISOString().slice(0, 10);
        const expire = a.date_expiration && a.date_expiration < aujourdHui;
        let badge;
        if (a.statut === 'actif' && !expire) badge = `<span class="badge badge-ok">Actif</span>`;
        else if (expire) badge = `<span class="badge badge-danger">Expiré</span>`;
        else badge = `<span class="badge badge-warn">Inactif</span>`;
        const actionLabel = a.statut === 'actif' ? 'Désactiver' : 'Activer';
        const nouveauStatut = a.statut === 'actif' ? 'inactif' : 'actif';
        return `<tr><td>${a.email || '-'}</td><td>${a.user_id}</td><td>${a.plan || '-'}</td><td>${a.date_expiration || '-'}</td><td>${badge}</td><td><button class="btn btn-small" onclick="toggleAbonnement('${a.user_id}', '${nouveauStatut}')">${actionLabel}</button></td></tr>`;
      }).join('');
    }

    async function toggleAbonnement(userId, nouveauStatut) {
      const { error } = await db.from('abonnements').update({ statut: nouveauStatut }).eq('user_id', userId);
      if (handleDbError("la mise à jour de l'abonnement", error)) return;
      loadAbonnements();
    }

    window.addEventListener('load', async () => {
      while (!window.Clerk) await new Promise(r => setTimeout(r, 100));
      await window.Clerk.load();

      if (!window.Clerk.user) {
        window.Clerk.redirectToSignIn();
        return;
      }

      document.getElementById('auth-btn').innerHTML = `<button class="btn" onclick="window.Clerk.signOut()">Déconnexion</button>`;

      if (!estAdmin(window.Clerk.user)) {
        document.getElementById('refuse').classList.add('active');
        return;
      }

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        accessToken: async () => {
          if (window.Clerk.session) return await window.Clerk.session.getToken({ template: 'E', skipCache: true });
          return null;
        }
      });

      document.getElementById('admin-content').classList.add('active');
      document.getElementById('ab-expiration').value = calculerExpiration('mensuel');
      loadAbonnements();
    });
  </script>
</body>
</html>
