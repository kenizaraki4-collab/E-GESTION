<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Gestion Pro — Admin Abonnements</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root {
      --bg: #050a14;
      --panel: #0a1220;
      --text: #f5f8ff;
      --muted: #91a0b8;
      --blue: #22a9ff;
      --ok: #2ecc71;
      --warn: #ffc107;
      --danger: #ff4d4d;
      --line: rgba(255, 255, 255, .09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* En-tête */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--blue);
    }

    /* Cartes & Panneaux */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Formulaires */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row.full-width {
      grid-column: 1 / -1;
    }

    .form-row label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .form-row input, 
    .form-row select {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-row input:focus, 
    .form-row select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(34, 169, 255, 0.15);
    }

    .form-row input:disabled, 
    .form-row select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .form-row select option {
      background-color: var(--panel);
      color: var(--text);
    }

    /* Boutons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: var(--blue);
      color: #000;
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      opacity: 0.95;
      box-shadow: 0 4px 14px rgba(34, 169, 255, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-submit {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    /* Tableau */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Badges de statut */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-ok {
      background: rgba(46, 204, 113, 0.12);
      color: var(--ok);
      border: 1px solid rgba(46, 204, 113, 0.25);
    }

    .badge-warn {
      background: rgba(255, 193, 7, 0.12);
      color: var(--warn);
      border: 1px solid rgba(255, 193, 7, 0.25);
    }

    .badge-danger {
      background: rgba(255, 77, 77, 0.12);
      color: var(--danger);
      border: 1px solid rgba(255, 77, 77, 0.25);
    }

    /* États d'accès */
    #refuse {
      display: none;
      min-height: 60vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    #refuse.active {
      display: flex;
    }

    #admin-content {
      display: none;
    }

    #admin-content.active {
      display: block;
    }

    /* Ajustements Mobile */
    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_YnJpZ2h0LWVsZXBoYW50LTMwMzUuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>E<span>-Gestion</span> Pro — Admin</h1>
      <div id="auth-btn"></div>
    </header>

    <!-- Accès refusé si l'utilisateur connecté n'est pas admin -->
    <div id="refuse">
      <h1>⛔ Accès refusé</h1>
      <p style="color:var(--muted); margin-top:10px">Cette page est réservée à l'administrateur d'E-Gestion Pro.</p>
    </div>

    <div id="admin-content">
      <div class="card">
        <h2>Souscrire un client</h2>
        <form id="form-abonnement" class="form-grid">
          <div class="form-row full-width">
            <label>User ID Clerk du client</label>
            <input type="text" id="ab-user-id" placeholder="user_xxxxxxxxxxxx" required>
          </div>
          <div class="form-row">
            <label>Email du client</label>
            <input type="email" id="ab-email" placeholder="client@exemple.com">
          </div>
          <div class="form-row">
            <label>Formule</label>
            <select id="ab-plan">
              <option value="mensuel">Mensuel — 10 000 FCFA (30 jours)</option>
              <option value="annuel">Annuel — 100 000 FCFA (365 jours)</option>
              <option value="personnalise">Personnalisé (choisir la date)</option>
            </select>
          </div>
          <div class="form-row">
            <label>Date d'expiration</label>
            <input type="date" id="ab-expiration" disabled>
          </div>
          <div class="form-row">
            <label>Statut</label>
            <select id="ab-statut">
              <option value="actif">Actif</option>
              <option value="inactif">Inactif</option>
            </select>
          </div>
          <button type="submit" class="btn btn-submit">Enregistrer l'abonnement</button>
        </form>
      </div>

      <div class="card">
        <h2>Clients abonnés</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>User ID</th>
                <th>Formule</th>
                <th>Expiration</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbl-abonnements">
              <tr>
                <td colspan="6" style="text-align:center; color: var(--muted); padding: 24px;">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pmxtqebppwpbgznmtiai.supabase.co";
    const SUPABASE_KEY = "sb_publishable__3zR170TFSBvLJTDlZ_UWQ_wtML7Sv3";
    const ADMIN_EMAILS = ["kenizaraki4@gmail.com"];
    let db = null;

    function handleDbError(context, error) {
      if (!error) return false;
      console.error(`Erreur ${context}:`, error);
      alert(`Erreur lors de ${context} : ${error.message}`);
      return true;
    }

    function estAdmin(user) {
      const email = user?.primaryEmailAddress?.emailAddress || user?.emailAddresses?.[0]?.emailAddress || '';
      return ADMIN_EMAILS.includes(email.toLowerCase());
    }

    function calculerExpiration(plan) {
      const d = new Date();
      if (plan === 'mensuel') d.setDate(d.getDate() + 30);
      else if (plan === 'annuel') d.setDate(d.getDate() + 365);
      else return document.getElementById('ab-expiration').value;
      return d.toISOString().slice(0, 10);
    }

    document.getElementById('ab-plan').addEventListener('change', (e) => {
      const expInput = document.getElementById('ab-expiration');
      if (e.target.value !== 'personnalise') {
        expInput.value = calculerExpiration(e.target.value);
        expInput.disabled = true;
      } else {
        expInput.disabled = false;
      }
    });

    document.getElementById('form-abonnement').addEventListener('submit', async (e) => {
      e.preventDefault();
      const plan = document.getElementById('ab-plan').value;
      const { error } = await db.from('abonnements').upsert([{
        user_id: document.getElementById('ab-user-id').value.trim(),
        email: document.getElementById('ab-email').value.trim(),
        plan: plan,
        date_expiration: document.getElementById('ab-expiration').value,
        statut: document.getElementById('ab-statut').value
      }], { onConflict: 'user_id' });

      if (handleDbError("l'enregistrement de l'abonnement", error)) return;

      document.getElementById('form-abonnement').reset();
      document.getElementById('ab-expiration').value = calculerExpiration('mensuel');
      document.getElementById('ab-expiration').disabled = true;
      loadAbonnements();
    });

    async function loadAbonnements() {
      const { data, error } = await db.from('abonnements').select('*').order('date_expiration', { ascending: true });
      if (error) { console.error('Erreur chargement abonnements:', error); return; }
      if (!data) return;

      if (data.length === 0) {
        document.getElementById('tbl-abonnements').innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--muted); padding: 24px;">Aucun abonné trouvé.</td></tr>`;
        return;
      }

      document.getElementById('tbl-abonnements').innerHTML = data.map(a => {
        const aujourdHui = new Date().toISOString().slice(0, 10);
        const expire = a.date_expiration && a.date_expiration < aujourdHui;
        let badge;
        if (a.statut === 'actif' && !expire) badge = `<span class="badge badge-ok">Actif</span>`;
        else if (expire) badge = `<span class="badge badge-danger">Expiré</span>`;
        else badge = `<span class="badge badge-warn">Inactif</span>`;

        const actionLabel = a.statut === 'actif' ? 'Désactiver' : 'Activer';
        const nouveauStatut = a.statut === 'actif' ? 'inactif' : 'actif';

        return `
          <tr>
            <td><strong>${a.email || '-'}</strong></td>
            <td style="font-family: monospace; color: var(--muted);">${a.user_id}</td>
            <td>${a.plan || '-'}</td>
            <td>${a.date_expiration || '-'}</td>
            <td>${badge}</td>
            <td>
              <button class="btn btn-small" onclick="toggleAbonnement('${a.user_id}', '${nouveauStatut}')">${actionLabel}</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleAbonnement(userId, nouveauStatut) {
      const { error } = await db.from('abonnements').update({ statut: nouveauStatut }).eq('user_id', userId);
      if (handleDbError("la mise à jour de l'abonnement", error)) return;
      loadAbonnements();
    }

    window.addEventListener('load', async () => {
      while (!window.Clerk) await new Promise(r => setTimeout(r, 100));
      await window.Clerk.load();

      if (!window.Clerk.user) {
        window.Clerk.redirectToSignIn();
        return;
      }

      document.getElementById('auth-btn').innerHTML = `<button class="btn btn-small" onclick="window.Clerk.signOut()">Déconnexion</button>`;

      if (!estAdmin(window.Clerk.user)) {
        document.getElementById('refuse').classList.add('active');
        return;
      }

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        accessToken: async () => {
          if (window.Clerk.session) return await window.Clerk.session.getToken({ template: 'E', skipCache: true });
          return null;
        }
      });

      document.getElementById('admin-content').classList.add('active');
      document.getElementById('ab-expiration').value = calculerExpiration('mensuel');
      loadAbonnements();
    });
  </script>
</body>
</html>
