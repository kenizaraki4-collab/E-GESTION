<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Gestion | Stock &amp; Ventes</title>

  <style>
    :root{--bg:#050a14;--panel:#0a1220;--text:#f5f8ff;--muted:#91a0b8;--blue:#22a9ff;--blue2:#7bd5ff;--line:rgba(255,255,255,.09);--max:1100px;--danger:#ff4d4d;--warn:#ffc107;--ok:#2ecc71}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:30px 20px}
    .container{max-width:var(--max);margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:20px}
    h1{font-size:22px}
    h1 span{color:var(--blue)}
    h2{font-size:17px;margin-bottom:16px;color:var(--blue2)}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
    @media (max-width:800px){.grid{grid-template-columns:1fr}}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}

    .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .form-row label{font-size:12px;color:var(--muted);font-weight:600}
    .form-row input, .form-row select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:white;font-size:14px;outline:none}

    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;background:var(--blue);color:#02101c}
    .btn:hover{opacity:.9}
    .btn-full{width:100%}

    table{width:100%;border-collapse:collapse;text-align:left;margin-top:10px}
    th, td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
    th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}

    .badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}
    .badge-ok{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid rgba(46,204,113,.3)}
    .badge-warn{background:rgba(255,193,7,.15);color:var(--warn);border:1px solid rgba(255,193,7,.3)}
    .badge-danger{background:rgba(255,77,77,.15);color:var(--danger);border:1px solid rgba(255,77,77,.3)}

    .auth-gate{text-align:center;padding:80px 20px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:20px}
    .auth-gate p{color:var(--muted);margin-bottom:20px}

    .msg{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px;display:none}
    .msg.show{display:block}
    .msg.ok{background:rgba(46,204,113,.12);color:var(--ok)}
    .msg.error{background:rgba(255,77,77,.12);color:var(--danger)}
  </style>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YnJpZ2h0LWVsZXBoYW50LTMwMzUuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>E<span>-Gestion</span> &mdash; Stock &amp; Ventes</h1>
      <div id="auth-container"></div>
    </header>

    <div id="gate-app" class="auth-gate">
      <h3>Connexion requise</h3>
      <p>Connectez-vous pour accéder à votre espace de gestion.</p>
      <button class="btn" onclick="ouvrirConnexion()">Se connecter / S'inscrire</button>
    </div>

    <div id="app-content" style="display:none;">
      <div class="grid">
        <!-- AJOUT PRODUIT -->
        <div class="card">
          <h2>Ajouter un produit</h2>
          <form id="form-produit">
            <div class="form-row">
              <label for="p-nom">Nom du produit</label>
              <input type="text" id="p-nom" required maxlength="100">
            </div>
            <div class="form-row">
              <label for="p-prix">Prix unitaire (FCFA)</label>
              <input type="number" id="p-prix" min="0" step="1" required>
            </div>
            <div class="form-row">
              <label for="p-stock">Quantité en stock</label>
              <input type="number" id="p-stock" min="0" step="1" required>
            </div>
            <div class="form-row">
              <label for="p-seuil">Seuil d'alerte (stock bas)</label>
              <input type="number" id="p-seuil" min="0" step="1" value="5">
            </div>
            <button type="submit" class="btn btn-full">Ajouter le produit</button>
            <div id="msg-produit" class="msg"></div>
          </form>
        </div>

        <!-- VENTE RAPIDE -->
        <div class="card">
          <h2>Vente rapide</h2>
          <form id="form-vente">
            <div class="form-row">
              <label for="v-produit">Produit</label>
              <select id="v-produit" required></select>
            </div>
            <div class="form-row">
              <label for="v-quantite">Quantité vendue</label>
              <input type="number" id="v-quantite" min="1" step="1" required>
            </div>
            <button type="submit" class="btn btn-full">Enregistrer la vente</button>
            <div id="msg-vente" class="msg"></div>
          </form>
        </div>
      </div>

      <div class="card">
        <h2>État du stock</h2>
        <table>
          <thead>
            <tr>
              <th>Produit</th>
              <th>Prix</th>
              <th>Stock</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="stock-table-body">
            <tr><td colspan="4">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pmxtqebppwpbgznmtiai.supabase.co";
    const SUPABASE_KEY = "sb_publishable__3zR170TFSBvLJTDlZ_UWQ_wtML7Sv3";
    let supabaseClient = null;

    // SECURITE : echappement HTML pour empecher toute injection de script.
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function ouvrirConnexion() {
      if (window.Clerk) window.Clerk.redirectToSignIn();
    }

    function afficherMessage(id, texte, type) {
      const el = document.getElementById(id);
      el.textContent = texte;
      el.className = `msg show ${type}`;
      setTimeout(() => { el.className = 'msg'; }, 4000);
    }

    window.addEventListener('load', async () => {
      while (!window.Clerk) {
        await new Promise(r => setTimeout(r, 100));
      }
      await window.Clerk.load();

      const gateApp = document.getElementById('gate-app');
      const appContent = document.getElementById('app-content');
      const authContainer = document.getElementById('auth-container');

      if (!window.Clerk.user) {
        gateApp.style.display = 'block';
        appContent.style.display = 'none';
        authContainer.innerHTML = `<button class="btn" onclick="ouvrirConnexion()">Se connecter</button>`;
        return;
      }

      authContainer.innerHTML = `<button class="btn" onclick="window.Clerk.signOut()">Déconnexion</button>`;
      gateApp.style.display = 'none';
      appContent.style.display = 'block';

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        accessToken: async () => {
          if (window.Clerk.session) {
            return await window.Clerk.session.getToken({ skipCache: true });
          }
          return null;
        }
      });

      chargerProduits();
    });

    async function chargerProduits() {
      const tbody = document.getElementById('stock-table-body');
      const select = document.getElementById('v-produit');

      const { data: produits, error } = await supabaseClient
        .from('produits')
        .select('*')
        .order('nom', { ascending: true });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#ff4d4d;">Erreur : ${escapeHtml(error.message)}</td></tr>`;
        return;
      }

      if (!produits || produits.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">Aucun produit pour l'instant.</td></tr>`;
        select.innerHTML = `<option value="">Ajoutez d'abord un produit</option>`;
        return;
      }

      tbody.innerHTML = produits.map(p => {
        let badge;
        if (p.quantite_stock <= 0) {
          badge = `<span class="badge badge-danger">Rupture</span>`;
        } else if (p.quantite_stock <= p.seuil_alerte) {
          badge = `<span class="badge badge-warn">Stock bas</span>`;
        } else {
          badge = `<span class="badge badge-ok">OK</span>`;
        }
        return `
          <tr>
            <td>${escapeHtml(p.nom)}</td>
            <td>${escapeHtml(p.prix)} FCFA</td>
            <td>${escapeHtml(p.quantite_stock)}</td>
            <td>${badge}</td>
          </tr>
        `;
      }).join('');

      select.innerHTML = produits
        .filter(p => p.quantite_stock > 0)
        .map(p => `<option value="${escapeHtml(p.id)}" data-prix="${escapeHtml(p.prix)}" data-stock="${escapeHtml(p.quantite_stock)}">${escapeHtml(p.nom)} (${escapeHtml(p.quantite_stock)} en stock)</option>`)
        .join('');
    }

    document.getElementById('form-produit').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nom = document.getElementById('p-nom').value.trim();
      const prix = parseFloat(document.getElementById('p-prix').value);
      const stock = parseInt(document.getElementById('p-stock').value, 10);
      const seuil = parseInt(document.getElementById('p-seuil').value, 10) || 5;

      const { error } = await supabaseClient.from('produits').insert([{
        nom, prix, quantite_stock: stock, seuil_alerte: seuil
      }]);

      if (error) {
        afficherMessage('msg-produit', "Erreur : " + error.message, 'error');
        return;
      }

      afficherMessage('msg-produit', "Produit ajouté !", 'ok');
      document.getElementById('form-produit').reset();
      document.getElementById('p-seuil').value = 5;
      chargerProduits();
    });

    document.getElementById('form-vente').addEventListener('submit', async (e) => {
      e.preventDefault();

      const select = document.getElementById('v-produit');
      const produitId = select.value;
      const quantite = parseInt(document.getElementById('v-quantite').value, 10);

      if (!produitId) {
        afficherMessage('msg-vente', "Sélectionnez un produit.", 'error');
        return;
      }

      const option = select.selectedOptions[0];
      const prixUnitaire = parseFloat(option.dataset.prix);
      const stockDisponible = parseInt(option.dataset.stock, 10);

      if (quantite > stockDisponible) {
        afficherMessage('msg-vente', `Stock insuffisant (il reste ${stockDisponible}).`, 'error');
        return;
      }

      const { error } = await supabaseClient.from('ventes').insert([{
        produit_id: produitId,
        quantite_vendue: quantite,
        prix_unitaire: prixUnitaire
      }]);

      if (error) {
        afficherMessage('msg-vente', "Erreur : " + error.message, 'error');
        return;
      }

      afficherMessage('msg-vente', "Vente enregistrée !", 'ok');
      document.getElementById('form-vente').reset();
      chargerProduits();
    });
  </script>
</body>
</html>
